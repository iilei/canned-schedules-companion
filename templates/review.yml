# Reviews merge requests that change the catalog: every changed schedule file is checked (the core's check plus the
# catalog's rule that a file is named after its schedule), and one note on the merge request keeps the result up to
# date. A valid change gets the label, and a merge request with the web editor's default title ("Add new file", as
# the playground's proposals start) is named after its schedules.
#
# The flags come from the args file on the target branch, so a merge request can't loosen its own check. The job
# needs a project access token with the api scope and the Developer role, so it may label and rename merge requests,
# in the CI/CD variable CANNED_SCHEDULES_TOKEN or the one token-variable names. Merge requests from forks run their
# pipelines in the fork, without that variable, unless the project runs fork pipelines in the parent.
spec:
  description: Reviews merge requests that change the catalog's schedules.
  inputs:
    stage:
      description: The stage of the job.
      default: test
    version:
      description: The canned-schedules-companion release to install.
      default: "0.3.8"
      regex: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
    image:
      description: The job's image. An image that already contains the binary, git, curl and gnupg skips the downloads.
      default: alpine:3.22
    catalog-dir:
      description: The catalog's folder; only its *.canned-schedule.md files are reviewed.
      default: schedules
    args-file:
      description: The flags to check with, read from the target branch, as canned-schedules.args. A missing file means none.
      default: canned-schedules.args
    label:
      description: Added when every changed schedule is valid, removed otherwise. Empty leaves labels alone.
      default: Schedule
    retitle:
      description: Name the merge request after its schedules while it has the web editor's default title.
      type: boolean
      default: true
    api-url:
      description: The REST API as a job reaches it.
      default: $CI_API_V4_URL
    token-variable:
      description: The CI/CD variable with the job's project access token (api scope, the Developer role or more).
      default: CANNED_SCHEDULES_TOKEN
      regex: ^[A-Za-z_][A-Za-z0-9_]*$
    dry-run:
      description: Reads the merge request and says what would change, but writes nothing.
      type: boolean
      default: false
---
canned-schedule-review:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - $[[ inputs.catalog-dir ]]/*.canned-schedule.md
  variables:
    # The diff needs the merge request's base commit.
    GIT_DEPTH: "0"
    CS_VERSION: $[[ inputs.version ]]
    CS_CATALOG_DIR:
      value: $[[ inputs.catalog-dir ]]
      expand: false
    CS_ARGS_FILE:
      value: $[[ inputs.args-file ]]
      expand: false
    CS_LABEL: $[[ inputs.label ]]
    CS_RETITLE: $[[ inputs.retitle ]]
    CS_API_URL: $[[ inputs.api-url ]]
    CS_TOKEN_VARIABLE: $[[ inputs.token-variable ]]
    CS_DRY_RUN: $[[ inputs.dry-run ]]
    # canned-schedules' release key, the only one that may sign the download.
    CS_RELEASE_KEY: B645234C9CB8175ECA5D78A5C8447A2252E9E7B6
  script:
    - |
      set -eu

      fail() {
        printf 'canned-schedule-review: %s\n' "$1" >&2
        exit 2
      }

      # The input's regex allows only a variable name, so the eval reads that variable and nothing else.
      case $CS_TOKEN_VARIABLE in
        '' | [0-9]* | *[!A-Za-z0-9_]*) fail 'token-variable must name a CI/CD variable' ;;
      esac
      eval "cs_token=\${$CS_TOKEN_VARIABLE:-}"
      [ -n "$cs_token" ] || fail "set the CI/CD variable $CS_TOKEN_VARIABLE"

      if ! command -v git >/dev/null || ! command -v curl >/dev/null; then
        apk add --no-cache --quiet git curl
      fi

      if ! command -v canned-schedules-companion >/dev/null; then
        command -v gpg >/dev/null || apk add --no-cache --quiet gnupg

        case $(uname -m) in
          x86_64) arch=x86_64 ;;
          aarch64) arch=arm64 ;;
          armv7l) arch=armv7 ;;
          *) fail "no release for $(uname -m)" ;;
        esac

        archive=canned-schedules-companion_${CS_VERSION}_linux_${arch}.tar.gz
        release=https://github.com/iilei/canned-schedules-companion/releases/download/v$CS_VERSION
        bin_dir=$(mktemp -d)

        for file in "$archive" checksums.txt checksums.txt.sig release-key.asc; do
          curl --fail --silent --show-error --location --max-time 120 --output "$bin_dir/$file" "$release/$file"
        done

        GNUPGHOME=$(mktemp -d)
        export GNUPGHOME
        gpg --batch --quiet --import "$bin_dir/release-key.asc"
        gpg --batch --status-fd 1 --verify "$bin_dir/checksums.txt.sig" "$bin_dir/checksums.txt" 2>/dev/null |
          grep -q "^\[GNUPG:\] VALIDSIG .* $CS_RELEASE_KEY\$" || fail 'the release signature is not valid'
        (cd "$bin_dir" && awk -v f="$archive" '$2 == f' checksums.txt | sha256sum -c -s -) ||
          fail 'the download does not match checksums.txt'

        tar -xzf "$bin_dir/$archive" -C "$bin_dir" canned-schedules-companion
        PATH=$bin_dir:$PATH
      fi

      # The flags of the target branch: a merge request can't loosen its own check.
      set --
      if [ -n "$CS_ARGS_FILE" ] && git cat-file -e "$CI_MERGE_REQUEST_DIFF_BASE_SHA:$CS_ARGS_FILE" 2>/dev/null; then
        while IFS= read -r line || [ -n "$line" ]; do
          line=${line%"$(printf '\r')"}
          case $line in '' | '#'*) continue ;; esac
          set -- "$@" "$line"
        done <<CS_ARGS_END
      $(git show "$CI_MERGE_REQUEST_DIFF_BASE_SHA:$CS_ARGS_FILE")
      CS_ARGS_END
      fi

      # The schedule files the merge request adds or changes (deleted ones have nothing to check).
      files=$(mktemp)
      git diff --name-only --diff-filter=ACMR "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD -- \
        "$CS_CATALOG_DIR/*.canned-schedule.md" > "$files"
      while IFS= read -r f; do
        [ -n "$f" ] && set -- "$@" "$f"
      done < "$files"

      out_dir=$CI_PROJECT_DIR/canned-schedule-review
      rc=0
      canned-schedules-companion review render --out-dir "$out_dir" "$@" || rc=$?
      [ "$rc" -le 1 ] || exit "$rc"

      set -- --forge gitlab --repo "$CI_PROJECT_ID" --merge-request "$CI_MERGE_REQUEST_IID" --head-sha "$CI_COMMIT_SHA" \
        --api-url "$CS_API_URL" --token-env "$CS_TOKEN_VARIABLE"
      if [ -n "$CS_LABEL" ]; then set -- "$@" --label "$CS_LABEL"; fi
      if [ "$CS_RETITLE" = true ]; then set -- "$@" --retitle; fi
      if [ "$CS_DRY_RUN" = true ]; then set -- "$@" --dry-run; fi
      canned-schedules-companion review post "$@" "$out_dir"

      # The note lists the problems; the failed job makes them visible in the pipeline too.
      exit "$rc"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - canned-schedule-review/

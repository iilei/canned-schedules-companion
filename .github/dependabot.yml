# Updates for every pinned dependency except the tools in mise.toml (Dependabot doesn't read mise; bump those by hand,
# with versions at least two weeks old). The cooldown applies the same two-week rule. The core module
# (github.com/iilei/canned-schedules) is bumped by hand too: its pin is a decision, named in the release notes.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: github.com/iilei/canned-schedules
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
